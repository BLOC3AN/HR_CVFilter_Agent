version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hr-cv-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount source code for development
      - ./src:/app/src
      - ./backend:/app/backend
      # Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hr-cv-network

  # Frontend UI Service - Vite + React
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hr-cv-frontend
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hr-cv-network

networks:
  hr-cv-network:
    driver: bridge

