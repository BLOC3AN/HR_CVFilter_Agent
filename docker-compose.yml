version: '3.8'

services:
  hr-cv-filter-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-cv-filter-agent
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    env_file:
      - .env
    volumes:
      # Mount source code for development (optional - comment out for production)
      - ./src:/app/src
      - ./app.py:/app/app.py
      # Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - hr-cv-network

networks:
  hr-cv-network:
    driver: bridge

